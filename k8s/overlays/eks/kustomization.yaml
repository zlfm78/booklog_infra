# ④ EKS Auto Mode용: web은 ALB(Ingress) 뒤의 ClusterIP(base 그대로), 이미지는 ECR, DB는 RDS Multi-AZ + RDS Proxy
#   자리표시자(ECR_REGISTRY · PROXY_ENDPOINT · RDS_ENDPOINT · ADMIN_SECRET_ARN · APP_SECRET_ARN)는
#   scripts/eks/deploy.sh가 적용할 때 실제 값으로 바꾼다 (계정 ID · 주소를 저장소에 남기지 않음)
#   클러스터 공통 설정(NodePool · StorageClass · IngressClass)은 k8s/cluster-eks, AWS 자원(RDS · Proxy · 비밀)은 scripts/eks/rds.sh
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# overlay에서 추가한 리소스에도 네임스페이스를 붙인다 (base의 namespace는 base 리소스에만 적용됨)
namespace: booklog
resources:
  - ../../base
  - ingress.yaml
  - secretproviderclass.yaml
  - networkpolicy-egress.yaml
# was 1.2.1(1.2.0 + RDS에서 ALTER ROLE 수정): IAM 토큰 접속(DB_IAM_AUTH) · 앱 계정 IAM 전용(APP_DB_IAM). ECR 태그는 IMMUTABLE
images:
  - name: jeonghyeonseong/booklog-was
    newName: ECR_REGISTRY/booklog-was
    newTag: 1.2.1
  - name: jeonghyeonseong/booklog-web
    newName: ECR_REGISTRY/booklog-web
    newTag: 1.0.0
patches:
  # DB는 클러스터 밖(RDS) → base의 db StatefulSet · Service · SA · 들어오는 NetworkPolicy를 뺀다
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: db}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: db}
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: db}
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: db-from-was}
  # 접속 주소: was → Proxy, migrate(관리 계정) → RDS 직접. 앱 계정 이름은 비밀이 아니므로 ConfigMap
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: booklog-config}
      data:
        DB_HOST: PROXY_ENDPOINT
        DB_ADMIN_HOST: RDS_ENDPOINT
        APP_DB_USER: booklog_app
        AWS_REGION: ap-northeast-2
  - path: was-rds.yaml
  # web · was를 가용 영역(2a · 2c)에 1개씩 강제 분산 (④만 — ③은 AZ가 하나)
  #   base의 노드 단위 ScheduleAnyway만으로는 Auto Mode가 노드 1대에 몰아 담음(2026-11-24 배포에서 확인)
  #   DoNotSchedule: 조건을 못 지키면 Pending → Auto Mode가 빈 AZ에 노드를 새로 만든다
  #   minDomains가 없으면 스케줄러는 노드가 있는 AZ(2c)만 센다 → 2c 하나에 몰려도 "분산됨"으로 판단 (2026-11-24 적용에서 확인)
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/-
        value:
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2   # 노드가 있는 AZ가 1개뿐이어도 "AZ 2개"로 계산 → 두 번째 Pod는 Pending → Auto Mode가 빈 AZ에 노드 생성
          labelSelector:
            matchLabels: {app: web}
          matchLabelKeys: [pod-template-hash]   # 롤링 중에는 새 버전 Pod끼리만 세어 분산 (옛 Pod 때문에 한쪽에 몰리지 않게)
  - target: {kind: Deployment, name: was}
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/-
        value:
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          minDomains: 2   # 노드가 있는 AZ가 1개뿐이어도 "AZ 2개"로 계산 → 두 번째 Pod는 Pending → Auto Mode가 빈 AZ에 노드 생성
          labelSelector:
            matchLabels: {app: was}
          matchLabelKeys: [pod-template-hash]   # 롤링 중에는 새 버전 Pod끼리만 세어 분산 (옛 Pod 때문에 한쪽에 몰리지 않게)
