# Secrets Manager → Pod (Secrets Store CSI Driver + AWS 제공자, EKS 애드온)
#   was Pod가 이 볼륨을 마운트하면 제공자가 Pod의 신분(Pod Identity, SA was)으로 비밀을 읽어
#   파일로 마운트하고 secretObjects의 K8s Secret으로도 동기화한다 → 매니페스트는 기존처럼 secretKeyRef로 읽음
#   순환: 드라이버가 1분마다 다시 읽어 파일 · Secret을 갱신 (애드온 설정 rotationPollInterval, scripts/eks/rds.sh)
#   ADMIN_SECRET_ARN · APP_SECRET_ARN은 자리표시자 — scripts/eks/deploy.sh가 적용할 때 바꾼다 (계정 ID를 저장소에 남기지 않음)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: booklog
spec:
  provider: aws
  parameters:
    region: ap-northeast-2
    usePodIdentity: "true"
    objects: |
      - objectName: "ADMIN_SECRET_ARN"
        objectAlias: db-admin
        jmesPath:
          - {path: username, objectAlias: db-admin-username}
          - {path: password, objectAlias: db-admin-password}
      - objectName: "APP_SECRET_ARN"
        objectAlias: app
        jmesPath:
          - {path: JWT_SECRET, objectAlias: jwt-secret}
          - {path: DEMO_PASSWORD, objectAlias: demo-password}
  secretObjects:
    # RDS가 관리 · 순환하는 관리 계정 (migrate initContainer만 사용)
    - secretName: booklog-db-admin
      type: Opaque
      data:
        - {objectName: db-admin-username, key: DB_ADMIN_USER}
        - {objectName: db-admin-password, key: DB_ADMIN_PASSWORD}
    # 앱 계정에는 비밀번호가 없다 (IAM 인증). 서명 키와 데모 비밀번호만
    - secretName: booklog-app
      type: Opaque
      data:
        - {objectName: jwt-secret, key: JWT_SECRET}
    - secretName: booklog-demo
      type: Opaque
      data:
        - {objectName: demo-password, key: DEMO_PASSWORD}
