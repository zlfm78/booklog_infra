# 키 이름만 (값은 저장소에 두지 않음). 실제 Secret은 scripts/k8s/secrets.sh가 .env 값으로 클러스터에 직접 만든다
apiVersion: v1
kind: Secret
metadata: {name: booklog-db-admin, namespace: booklog}   # db 초기화 · migrate (슈퍼유저)
stringData: {DB_ADMIN_USER: "", DB_ADMIN_PASSWORD: ""}
---
apiVersion: v1
kind: Secret
metadata: {name: booklog-app, namespace: booklog}        # was (앱 계정, JWT 서명 키)
stringData: {DB_USER: "", DB_PASSWORD: "", JWT_SECRET: ""}
---
apiVersion: v1
kind: Secret
metadata: {name: booklog-demo, namespace: booklog}       # migrate의 시드 데모 계정
stringData: {DEMO_PASSWORD: ""}
