---
# ④ 앱 전용 노드 설정 (EKS Auto Mode). 기본 general-purpose 풀은 끄고(create.sh의 computeConfig.nodePools: [system]) 이 풀을 쓴다.
# NODE_ROLE_NAME · CLUSTER_SECURITY_GROUP_ID는 scripts/eks/create.sh가 채운다 (계정 ID가 들어가지 않는 값)
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: booklog
spec:
  role: NODE_ROLE_NAME                 # 노드 IAM 역할 (클러스터의 nodeRoleArn과 같은 역할)
  subnetSelectorTerms:                 # 노드는 프라이빗 서브넷에만
    - tags:
        Project: booklog-eks
        Tier: private
  securityGroupSelectorTerms:          # 클러스터 보안 그룹 (EKS가 만든 것)
    - id: CLUSTER_SECURITY_GROUP_ID
  advancedNetworking:
    associatePublicIPAddress: false    # 노드에 공인 IP 없음 (바깥으로는 regional NAT)
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: booklog
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: booklog
      requirements:
        - key: eks.amazonaws.com/instance-category
          operator: In
          values: ["c", "m"]
        - key: eks.amazonaws.com/instance-cpu
          operator: In
          values: ["2"]
        - key: kubernetes.io/arch       # 이미지가 linux/amd64만 있음 (arm64 Graviton이 골라지지 않게)
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  limits:
    cpu: "8"                           # 이 풀의 vCPU 합계 상한 = 2 vCPU 노드 최대 4대 (설정 실수로 노드가 늘어도 비용 제한)
