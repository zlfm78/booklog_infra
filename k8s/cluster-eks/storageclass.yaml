---
# ④ EBS StorageClass — Auto Mode는 StorageClass를 만들지 않으므로 직접 만든다 (기본 StorageClass로 지정하지 않음)
# db PVC는 overlays/eks가 storageClassName: booklog-gp3로 지정 (③ overlays/ec2의 local-path 자리)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: booklog-gp3
provisioner: ebs.csi.eks.amazonaws.com   # Auto Mode 내장 EBS 드라이버
volumeBindingMode: WaitForFirstConsumer  # Pod가 배치된 AZ에 볼륨을 만든다
reclaimPolicy: Delete                    # PVC를 지우면 EBS도 삭제 (발표 후 남는 볼륨 없게)
allowedTopologies:                       # Auto Mode 노드에만
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values: ["auto"]
parameters:
  type: gp3
  encrypted: "true"                      # 기본값 false → 명시. 키 미지정 = 리전 기본 키 aws/ebs
