# web: Nginx(빌드 결과물 + /api 프록시), 2개 (노드 분산). 외부 노출 방식은 overlay가 정함 (ec2: NodePort)
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {app: web}
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: web, tier: web}
    spec:
      serviceAccountName: web          # 전용 SA (serviceaccounts.yaml, API 토큰 마운트 없음)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                  # nginx-unprivileged 이미지의 nginx 사용자
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: web
          image: booklog-web
          ports:
            - {name: http, containerPort: 8080}
          lifecycle:                      # 무중단 롤링: 엔드포인트에서 빠질 시간을 준 뒤 종료 (was.yaml 설명 참고)
            preStop:
              exec: {command: ["sleep", "5"]}
          env:
            # Nginx가 요청할 때마다 was Service 이름을 CoreDNS로 조회.
            # Nginx resolver는 /etc/resolv.conf의 search 도메인을 붙이지 않으므로 짧은 이름(was)이 아니라 전체 이름(FQDN)
            # (compose에서는 Docker 내장 DNS가 짧은 이름을 바로 풀어 줘서 http://was:8000으로 동작했음)
            - name: WAS_URL
              value: http://was.booklog.svc.cluster.local:8000
          readinessProbe:                 # 빌드 결과물(index.html)까지 제공되는가
            httpGet: {path: /, port: http}
            periodSeconds: 5
          # 시작 확인: 성공할 때까지 liveness · readiness를 미룬다 (2초마다, 최대 30번 = 60초)
          #   고정 initialDelaySeconds 대신 → 시작이 늦어져도 liveness가 일찍 죽여 재시작 반복(CrashLoopBackOff)이 되지 않게
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                  # Nginx 프로세스만
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # 루트 파일시스템은 쓰기 가능으로 둠: 시작할 때 설정 템플릿을 /etc/nginx/conf.d에 씀
