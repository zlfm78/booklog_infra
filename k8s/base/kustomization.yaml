# booklog 공통 매니페스트 (③ EC2 · ④ EKS 공통). 환경별 차이는 overlays/ec2, overlays/eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: booklog
labels:
  - pairs:
      app.kubernetes.io/part-of: booklog
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - db.yaml
  - was.yaml
  - web.yaml
  - networkpolicy.yaml
  - serviceaccounts.yaml
  - pdb.yaml
# Secret(booklog-db-admin · booklog-app · booklog-demo)은 저장소에 두지 않는다.
#   scripts/k8s/secrets.sh가 .env 값으로 클러스터에 직접 만든다 (키 목록: secret.example.yaml)
images:
  - name: booklog-was
    newName: jeonghyeonseong/booklog-was
    newTag: 1.0.1
  - name: booklog-web
    newName: jeonghyeonseong/booklog-web
    newTag: 1.0.0
