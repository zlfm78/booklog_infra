# 전용 ServiceAccount — 앱(was · web · db)은 Kubernetes API를 쓰지 않으므로 API 토큰을 Pod에 넣지 않는다 (최소 권한)
#   기본(default SA)은 토큰이 /var/run/secrets/kubernetes.io/serviceaccount에 자동 마운트된다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: was
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
automountServiceAccountToken: false
